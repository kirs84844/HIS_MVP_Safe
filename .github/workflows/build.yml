name: Build Safe Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.8 (For Win7 32-bit Compatibility)
      uses: actions/setup-python@v4
      with:
        python-version: '3.8.10'
        architecture: 'x86'  # <--- 核心修复：强制声明 32 位架构

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller pyperclip
        pip install -r requirements.txt

    - name: Build EXE (无控制台黑框 32位版)
      run: |
        pyinstaller --onefile --noconsole --name HIS_MVP_Safe_V6.5 main.py

    - name: Upload EXE
      uses: actions/upload-artifact@v4
      with:
        name: HIS_MVP_Safe_V6.5
        path: dist/HIS_MVP_Safe_V6.5.exe
